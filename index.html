<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<meta name="theme-color" content="#e5533c">
<meta name="description" content="Timer de foco com ciclos configuráveis e histórico diário.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>🍅 Pomodoro</h1>

    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="focus">Foco</button>
      <button class="mode-btn" data-mode="short">Pausa curta</button>
      <button class="mode-btn" data-mode="long">Pausa longa</button>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="timer-display">
        <span id="time">25:00</span>
        <span id="cycle-label">Ciclo 1 de 4</span>
      </div>
    </div>

    <div class="controls">
      <button id="start-pause">Iniciar</button>
      <button id="reset">Reiniciar</button>
    </div>

    <button id="install-btn" class="install-btn hidden">📲 Instalar app</button>

    <details class="settings">
      <summary>Configurações</summary>
      <div class="settings-grid">
        <label>Foco (min) <input type="number" id="focus-input" min="1" max="90" value="25" autocomplete="off"></label>
        <label>Pausa curta (min) <input type="number" id="short-input" min="1" max="30" value="5" autocomplete="off"></label>
        <label>Pausa longa (min) <input type="number" id="long-input" min="1" max="60" value="15" autocomplete="off"></label>
        <label>Ciclos até pausa longa <input type="number" id="cycles-input" min="1" max="8" value="4" autocomplete="off"></label>
      </div>
    </details>

    <div class="history">
      <div class="history-header">
        <h2>Histórico de hoje</h2>
        <button id="clear-history">Limpar</button>
      </div>
      <div class="stats">
        <div class="stat"><span id="sessions-count">0</span><small>sessões concluídas</small></div>
        <div class="stat"><span id="focus-total">0min</span><small>tempo de foco</small></div>
      </div>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
